<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="每日全球新闻与 AI 动态，附原文、时间与核查说明。">
  <title>每日资讯 · 全球新闻与 AI 动态</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="topline"></div>
  <header class="site-header wrap">
    <a class="brand" href="./" aria-label="每日资讯首页"><span class="brand-mark">日</span><span>每日资讯</span></a>
    <nav aria-label="主导航"><a href="#global">全球新闻简报</a><a href="#ai">AI 动态</a><a href="#archive">归档</a><a href="skills/news-collection/SKILL.md">采集规则</a></nav>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">DAILY BRIEFING <span class="dot"></span> 北京时间</div>
      <h1 id="page-title">把世界读清楚。</h1>
      <p>两份简报，一次晨读。每条消息都附原文、时间与核查边界。</p>
      <div class="hero-meta"><span id="edition">正在载入最新一期…</span><span id="updated"></span></div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="global" class="news-section" aria-labelledby="global-title">
      <div class="section-heading"><div><span class="section-number">01 / THE WORLD</span><h2 id="global-title">全球新闻简报</h2></div><p>关注影响范围广、可从独立来源交叉印证的国际事件。</p></div>
      <div id="global-items" class="cards" aria-live="polite"></div>
    </section>
    <section id="ai" class="news-section" aria-labelledby="ai-title">
      <div class="section-heading"><div><span class="section-number">02 / INTELLIGENCE</span><h2 id="ai-title">AI 动态</h2></div><p>产品、研究与政策进展，以可核查的原始报道为准。</p></div>
      <div id="ai-items" class="cards" aria-live="polite"></div>
    </section>
    <section id="archive" class="archive-section" aria-labelledby="archive-title"><div class="section-heading"><div><span class="section-number">PREVIOUS EDITIONS</span><h2 id="archive-title">往期归档</h2></div></div><div id="archive-list" class="archive-list"></div></section>
  </main>
  <footer class="wrap"><div class="footer-rule"></div><p>保留疑问，追溯原文。自动核查只比较公开报道，不等同于人工事实调查。</p><a href="https://github.com/Zhangsfish/daily_tasks">查看公开代码与方法 ↗</a></footer>
</body>
</html>
