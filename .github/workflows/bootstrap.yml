name: Check hosted write and deploy site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/**'
      - 'tests/**'
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication gate
        run: python -m unittest discover -s tests -v
      - name: Record hosted repository write
        run: |
          mkdir -p ops
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          record = {
              "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "result": "cloud runner wrote and pushed this record",
          }
          Path("ops/automation-check.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/automation-check.json
          git commit -m 'Record hosted write check'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
